[package]
name = "oidc-fun"
version = "0.1.0"
edition = "2024"

[dependencies]
openidconnect = "4.0.1"
tokio = { version = "1.51.1", features = ["full"] }
derive_more = { version = "2.1.1", features = ["full"] }
tracing = "0.1.44"
reqwest = { version = "0.12.28", features = ["rustls-tls"], default-features = false }
url = "2.5.8"
uuid = { version = "1.23.0", features = ["v4"] }
snafu = { version = "0.9.0", features = ["std", "futures"] }
oauth2 = "5.0.0"
axum = { version = "0.8.8", features = ["macros", "ws"] }
tower-http = { version = "0.6.8", features = ["trace", "cors"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
axum-extra = { version = "0.12.5", features = ["cookie", "typed-header"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
keycloak = { version = "26.6.1", features = ["reqwest12", "tags-all"], default-features = false }
toml = "1.1.2"
clap = { version = "4.6.0", features = ["derive"] }
tokio-util = "0.7.18"

[lints.rust]
unsafe_code = { level = "deny", priority = 1 }
deprecated_safe = "warn"
future_incompatible = "warn"
keyword_idents = "warn"
rust_2018_idioms = "warn"
unused = "warn"
non_local_definitions = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
single_use_lifetimes = "warn"
unit_bindings = "warn"
unused_crate_dependencies = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"

[lints.clippy]
use_self = "warn"
