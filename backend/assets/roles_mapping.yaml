services:
  - name: KITHUB
    url: https://hub.kitctf.de
    group: HUB
    icon: kithub
    description: Central Hub for all things CTF
    token_claims:
      - restricted-access in resource_access.hub.roles
  - name: KITHUB (Beta)
    url: https://hub.kitctf.de
    group: HUB
    icon: kithub
    description: Beta Hub
    token_claims:
      - restricted-access in resource_access.hub-beta.roles
  - name: Account Console
    url: https://sso.kitctf.de/realms/kitctf/account/
    group: management
    icon: keycloak
    description: User account management
    token_claims:
      - view-profile in resource_access.account.roles
      - manage-account in resource_access.account.roles
  - name: Grafana
    url: https://grafana.noinfra.de
    group: gpnctf
    icon: grafana
    description: Monitoring for GPNCTF
    token_claims:
      - restricted-access in resource_access.gpnctf-grafana.roles
  - name: Kubernetes
    url: https://github.com/kitctf/gpnctf-24-infra-kubernetes/
    group: gpnctf
    icon: kubernetes
    description: GPNCTF Kubernetes Infrastructure
    token_claims:
      - restricted-access in resource_access.kubernetes.roles
  - name: Hedgedoc
    url: https://pad.kitctf.de
    group: tools
    icon: hedgedoc
    description: Catalog information about challenges
    token_claims:
      - restricted-access in resource_access.hedgedoc.roles
  - name: Mattermost
    url: https://chat.kitctf.de
    group: tools
    icon: chat
    description: Chatting platform for leisure and organization
    token_claims:
      - restricted-access in resource_access.mattermost.roles
  - name: Mitgliederverwaltung
    url: https://sso.kitctf.de
    group: management
    icon: keycloak
    description: Manage KIT member accounts
    token_claims:
      - restricted-access in resource_access.security-admin-console.roles
  - name: User Einladen
    url: https://invite.kitctf.de
    group: management
    icon: inviter
    description: Invite new Players!
    token_claims:
      - restricted-access in resource_access.user-invitation.roles
  - name: Vaultwarden
    url: https://pass.kitctf.de
    group: secrets
    icon: vaultwarden
    description: Credential management
    token_claims:
      - restricted-access in resource_access.vaultwarden.roles
  - name: Hashicorp Vault
    url: https://vault.kitctf.de
    group: secrets
    icon: vault
    description: Credential management (infra edition)
    token_claims:
      - restricted-access in resource_access.vault.roles
  - name: WikiJS
    url: https://wiki.kitctf.de
    group: tools
    icon: wiki
    description: I have no idea
    token_claims:
      - restricted-access in resource_access.wikijs.roles